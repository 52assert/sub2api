<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f2e5">
  <title>慢慢骑 · 鹈鹕的海岸小旅行</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f2e5;
      --ink: #344c45;
      --muted: #8a9180;
      --accent: #c87252;
      --scene-duration: 3.293s;
      --breeze-duration: 2.8s;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid #c8725280; outline-offset: 5px; }
    .page { max-width: 1600px; min-height: 100svh; margin: auto; padding: 32px 56px 24px; }
    .masthead { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark { width: 38px; height: 38px; }
    .brand-name { font-size: 17px; font-weight: 650; letter-spacing: 3px; }
    .brand-caption { margin-top: 3px; color: var(--muted); font-size: 9px; letter-spacing: 2.3px; }
    .edition { display: flex; align-items: center; gap: 9px; color: #7e8878; font-size: 11px; letter-spacing: 1.5px; }
    .edition::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #c87252; }
    .intro { position: relative; z-index: 1; margin-top: 40px; text-align: center; }
    .eyebrow { margin: 0 0 14px; color: #ac795c; font-size: 10px; font-weight: 600; letter-spacing: 4px; }
    h1 { margin: 0; font-family: "Songti SC", "Noto Serif CJK SC", "SimSun", serif; font-size: clamp(31px, 3.8vw, 52px); font-weight: 600; letter-spacing: 5px; line-height: 1.5; }
    .intro p:last-child { margin: 13px 0 0; color: #89907e; font-size: 13px; letter-spacing: 2px; }
    .scene-wrap { position: relative; margin: -8px -38px -21px; }
    .scene { display: block; width: 100%; height: auto; overflow: visible; }
    .cloud-float { animation: cloud-float 24s ease-in-out infinite alternate; }
    .cloud-float.second { animation-delay: -12s; }
    .scenery-drift { animation: scenery-drift var(--scene-duration) linear infinite; }
    .scenery-drift-water { animation-duration: calc(var(--scene-duration) * 3); }
    .breeze { animation: breeze var(--breeze-duration) ease-in-out infinite; transform-box: fill-box; transform-origin: right center; }
    .flower-sway { animation: flower-sway var(--breeze-duration) ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center bottom; }
    .flying-bird { animation: flying-bird 5s ease-in-out infinite; }
    .flying-bird.second { animation-delay: -2.5s; }
    .paused .scene * { animation-play-state: paused !important; }
    @keyframes cloud-float { from { transform: translateX(-10px); } to { transform: translateX(20px); } }
    @keyframes scenery-drift { from { transform: translateX(0); } to { transform: translateX(-1440px); } }
    @keyframes breeze { 0%, 100% { transform: rotate(-3deg) scaleY(.96); } 50% { transform: rotate(5deg) scaleY(1.05); } }
    @keyframes flower-sway { from { transform: rotate(-2deg); } to { transform: rotate(4deg); } }
    @keyframes flying-bird { 0%,100% { transform: translate(0,0); } 50% { transform: translate(12px,-6px); } }
    .ride-panel {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      width: min(550px, 100%);
      margin: 0 auto;
      padding: 16px 20px;
      border: 1px solid #dddccc;
      border-radius: 22px;
      background: #fffcf3e8;
      box-shadow: 0 8px 24px #5d705409;
    }
    .transport { display: flex; align-items: center; gap: 13px; }
    .play-button { display: grid; place-items: center; flex-shrink: 0; width: 43px; height: 43px; padding: 0; border: 0; border-radius: 50%; background: var(--ink); color: #fffaf0; cursor: pointer; transition: background .2s, transform .2s; }
    .play-button:hover { background: #577565; transform: scale(1.04); }
    .play-button svg { width: 16px; height: 16px; }
    .play-symbol { display: none; }
    .paused .play-symbol { display: block; }
    .paused .pause-symbol { display: none; }
    .ride-status { font-size: 12px; letter-spacing: 1px; }
    .ride-location { margin-top: 5px; color: #929785; font-size: 10px; letter-spacing: 1px; }
    .panel-divider { height: 29px; width: 1px; background: #e7e5d8; }
    .speed-button { display: flex; align-items: center; justify-content: center; gap: 9px; min-width: 102px; padding: 10px 12px; border: 1px solid #e1e3d5; border-radius: 12px; background: #f3f2e8; color: #526755; cursor: pointer; transition: background .2s; }
    .speed-button:hover { background: #e9eddf; }
    .speed-button svg { width: 18px; height: 18px; }
    .speed-label { font-size: 11px; white-space: nowrap; }
    .footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 35px; color: #959987; font-size: 10px; letter-spacing: 1.5px; }
    .footer-note { display: flex; align-items: center; gap: 8px; }
    .footer-note svg { width: 15px; height: 15px; }
    .footer-english { font-size: 8px; letter-spacing: 2.4px; }
    @media (min-width: 1450px) { .scene-wrap { max-width: 1360px; margin-left: auto; margin-right: auto; } }
    @media (max-width: 700px) {
      .page { padding: 24px 22px; display: flex; flex-direction: column; min-height: 100svh; overflow: hidden; }
      .brand-name { font-size: 15px; }
      .edition { font-size: 9px; letter-spacing: 1px; }
      .intro { margin-top: 54px; }
      h1 { font-size: 32px; letter-spacing: 2px; }
      .eyebrow { font-size: 8px; letter-spacing: 2.5px; }
      .intro p:last-child { max-width: 250px; margin: 14px auto 0; font-size: 11px; line-height: 1.9; letter-spacing: 1.2px; }
      .scene-wrap { width: 185%; align-self: center; margin: 15px -40% 10px; }
      .ride-panel { padding: 14px; gap: 12px; border-radius: 19px; }
      .speed-button { min-width: 93px; padding: 10px; }
      .panel-divider { margin-left: auto; }
      .footer { margin-top: auto; padding-top: 40px; font-size: 9px; letter-spacing: 1px; }
      .footer-english { font-size: 7px; letter-spacing: 1px; }
    }
    @media (prefers-reduced-motion: reduce) { .page:not(.motion-enabled) .scene * { animation: none !important; } }
  </style>
</head>
<body>

      <div class="ride-panel" aria-label="动画播放控制">
        <div class="transport">
          <button class="play-button" id="play-toggle" type="button" aria-label="暂停动画" aria-pressed="false">
            <svg class="pause-symbol" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="3" y="2" width="3" height="12" rx="1"/><rect x="10" y="2" width="3" height="12" rx="1"/></svg>
            <svg class="play-symbol" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.8q0-1 1-.4l9 5.1q.9.5 0 1l-9 5.1q-1 .6-1-.4Z"/></svg>
          </button>
          <div><div class="ride-status" id="ride-status" aria-live="polite">沿着海岸，慢慢骑</div><div class="ride-location">晴天 · 海风 · 好心情</div></div>
        </div>
        <div class="panel-divider" aria-hidden="true"></div>
        <button class="speed-button" id="speed-toggle" type="button" aria-label="当前车速 1 倍，点击切换车速">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h10q5 0 5-3a3 3 0 0 0-5-2M2 12h17q5 0 3-4M5 17h9q5 0 4 4a3 3 0 0 1-5 0"/></svg>

    <footer class="footer">
      <span class="footer-note"><svg viewBox="0 0 20 20" fill="none" stroke="#909a7e" stroke-width="1.3" aria-hidden="true"><path d="M5 15C2 9 8 4 16 3c0 9-5 15-11 12Zm0 0 7-7M8 12v-3m0 3h3"/></svg>把着急留给昨天。</span>
      <span class="footer-english">ENJOY THE LITTLE THINGS</span>
    </footer>
  </div>

  <script>
    (() => {
      'use strict';
      const byId = (id) => document.getElementById(id);
      const ride = byId('ride');
      const playButton = byId('play-toggle');
      const speedButton = byId('speed-toggle');
      const pelican = byId('pelican');
      const rearSpokes = byId('rear-spokes');
      const frontSpokes = byId('front-spokes');
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const legs = ['near', 'far'].map((side) => ({
        side,
        outline: byId(`${side}-leg-outline`),
        path: byId(`${side}-leg`),
        foot: byId(`${side}-foot`),
        crank: byId(`${side}-crank`),
      }));
      const speeds = [1, 1.5, 0.65];
      const roadDuration = 1440 / (91 * 3.1 * 1.55);
      let speedIndex = 0;
      let paused = motionPreference.matches;
      let phase = -Math.PI / 4;
      let lastTime = null;
      let frameRequest = null;

      // Solve two connected leg segments so each foot stays on its pedal.
      function kneePoint(hip, foot, thigh, shin) {
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const along = (thigh * thigh - shin * shin + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, thigh * thigh - along * along));
        return {
          x: hip.x + along * dx / distance + bend * dy / distance,
          y: hip.y + along * dy / distance - bend * dx / distance,
        };
      }

      function draw() {
        const bob = Math.sin(phase * 2) * 2.2;
        pelican.setAttribute('transform', `translate(0 ${bob})`);
        const wheelAngle = phase * 180 / Math.PI * 1.55;
        rearSpokes.setAttribute('transform', `rotate(${wheelAngle})`);
        frontSpokes.setAttribute('transform', `rotate(${wheelAngle})`);
        legs.forEach((leg, index) => {
          const angle = phase + index * Math.PI;
          const foot = { x: 712 + Math.cos(angle) * 33, y: 590 + Math.sin(angle) * 33 };
          const hip = { x: index ? 680 : 687, y: 426 + bob };
          const knee = kneePoint(hip, foot, 108, 108);
          const path = `M${hip.x} ${hip.y} Q${knee.x - 2} ${knee.y - 6} ${knee.x} ${knee.y} L${foot.x} ${foot.y}`;
          leg.outline.setAttribute('d', path);
          leg.path.setAttribute('d', path);
          leg.foot.setAttribute('transform', `translate(${foot.x} ${foot.y})`);
          leg.crank.setAttribute('d', `M712 590 L${foot.x} ${foot.y}`);
        });
      }

      function tick(time) {
        frameRequest = null;
        if (paused || document.hidden) return;
        if (lastTime !== null) phase = (phase + Math.min((time - lastTime) / 1000, 0.05) * 3.1 * speeds[speedIndex]) % (Math.PI * 40);
        lastTime = time;
        draw();
        frameRequest = requestAnimationFrame(tick);
      }

      function syncPlayback() {
        ride.classList.toggle('paused', paused);
        ride.classList.toggle('motion-enabled', !paused);
        playButton.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
        playButton.setAttribute('aria-pressed', String(paused));
        byId('ride-status').textContent = paused ? '停一停，看看海' : '沿着海岸，慢慢骑';
        if (frameRequest !== null) cancelAnimationFrame(frameRequest);
        frameRequest = null;
        lastTime = null;
        if (!paused && !document.hidden) frameRequest = requestAnimationFrame(tick);
      }

      playButton.addEventListener('click', () => { paused = !paused; syncPlayback(); });
      speedButton.addEventListener('click', () => {
        speedIndex = (speedIndex + 1) % speeds.length;
        const speed = speeds[speedIndex];
        byId('speed-label').textContent = `${speed}× 车速`;
        speedButton.setAttribute('aria-label', `当前车速 ${speed} 倍，点击切换车速`);
        ride.style.setProperty('--scene-duration', `${roadDuration / speed}s`);
        ride.style.setProperty('--breeze-duration', `${2.8 / speed}s`);
      });
      document.addEventListener('keydown', (event) => {
        if (event.code === 'Space' && !event.repeat && !event.target.closest('button, input, textarea, select, a, [contenteditable="true"]')) {
          event.preventDefault();
          paused = !paused;
          syncPlayback();
        }
      });
      document.addEventListener('visibilitychange', () => {
        ride.classList.toggle('paused', paused || document.hidden);
        if (frameRequest !== null) cancelAnimationFrame(frameRequest);
        frameRequest = null;
        lastTime = null;
        if (!paused && !document.hidden) frameRequest = requestAnimationFrame(tick);
      });
      motionPreference.addEventListener('change', (event) => {
        if (event.matches) { paused = true; syncPlayback(); }
      });
      draw();
      syncPlayback();
    })();
  </script>
</body>
