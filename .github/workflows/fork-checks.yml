name: Fork - Reusable checks

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      base:
        required: false
        type: string
        default: ''
      head:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed areas
        id: diff
        env:
          BASE: ${{ inputs.base }}
          HEAD: ${{ inputs.head }}
        run: |
          # Without an explicit base/head (e.g. a direct push), stay conservative
          # and run every job. With a diff, skip the suites whose area is untouched.
          backend=true
          frontend=true
          changed_ok=false
          if [ -n "$BASE" ] && [ -n "$HEAD" ]; then
            if git diff --name-only "$BASE...$HEAD" > /tmp/changed-files.txt 2>/dev/null; then
              changed_ok=true
            elif git diff --name-only "$BASE" "$HEAD" > /tmp/changed-files.txt 2>/dev/null; then
              changed_ok=true
            fi
          fi
          if [ "$changed_ok" = "true" ]; then
            grep -q '^backend/' /tmp/changed-files.txt || backend=false
            grep -q '^frontend/' /tmp/changed-files.txt || frontend=false
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend frontend=$frontend"
          if [ -f /tmp/changed-files.txt ]; then sed -n '1,50p' /tmp/changed-files.txt; fi

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: make test-unit test-integration
        working-directory: backend
      - run: go build ./cmd/server
        working-directory: backend

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend exec vitest run src/components/common/__tests__/ContainerUpdatePanel.spec.ts src/components/admin/account/__tests__/AccountSubscriptionResetModal.spec.ts
      - run: make test-frontend
      - run: pnpm --dir frontend run build

  lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Check fork scripts and deployment configuration
        run: |
          bash -n tools/custom/sync-upstream.sh
          python3 tools/custom/test_sync.py
          node --test tools/custom/test_auto_merge.cjs
          node --test tools/custom/test_resolve_skip.cjs
          python3 -m unittest discover -s deploy/updater -p 'test_*.py'
          POSTGRES_PASSWORD=validation-only SUB2API_IMAGE=ghcr.io/52assert/sub2api:validation \
            docker compose -f deploy/docker-compose.local.yml -f deploy/docker-compose.custom.yml config --quiet
      - name: Check existing deployment scripts
        run: |
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh
